schema_version = "1.3"
multi_step_reward_strategy = "mean"

[task]
name = "panlabel-fixtures/minimal-multi-step"
description = "Synthetic Harbor multi-step layout fixture."
authors = [{ name = "panlabel fixture" }]
keywords = ["fixture", "harbor", "multi-step"]

[environment]
build_timeout_sec = 60.0
workdir = "/app"
network_mode = "no-network"

[[steps]]
name = "scaffold"
min_reward = 1.0

[steps.agent]
timeout_sec = 30.0

[steps.verifier]
timeout_sec = 30.0
